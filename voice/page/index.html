<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Call the Commander</title>
  <link rel="stylesheet" href="/call.css">
</head>
<body>
  <main class="call">
    <header>
      <h1>Commander</h1>
      <p id="state" class="state" aria-live="polite">Ready. Press Call or the space bar.</p>
    </header>

    <button id="call" class="call-btn" type="button" aria-pressed="false">Call</button>

    <section class="captions" aria-label="Live captions">
      <ol id="captions"></ol>
    </section>

    <section class="fleet" aria-label="Agents">
      <h2>Agents <span id="fleet-at" class="muted"></span></h2>
      <ul id="fleet"></ul>
    </section>
  </main>
  <script src="/vendor/elevenlabs.js"></script>
  <script src="/call.js"></script>
</body>
</html>
